name: oracle

# The 26,000-test book is a day-trade book: the signal is known at the close, the order
# rests at a level during the next session, the exit is that session's close. So one run
# after the futures close is enough to record it — the runner only processes completed,
# settled bars, so a missed run is caught up on the next one instead of being lost.
#
# The cron sits at 22:20Z, not at the 21:00Z close, on purpose. A session is only trusted
# once 21:30Z has passed *and* the feed has had 30 minutes to finalise the bar; a run
# inside that window stays on the previous session rather than recording a bar that is
# still being written. Being 50 minutes late is free — the session chosen no longer
# depends on the wall clock.
on:
  schedule:
    - cron: "20 22 * * 1-5"     # 22:20 UTC: 80 min after the CME close, 20 min after the roll
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oracle
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install numpy
        run: python -m pip install --disable-pip-version-check numpy

      - name: Record the book
        run: python trading/paper_oracle.py

      # The buffer-safe challenger (nday_fade-5 on ES) is retired. The stop sweep put
      # 0.2-0.5 ATR stops at -$50k to -$145k over 979 trades: a stop small enough for the
      # $1,000 buffer has no edge left in it. Its replay stays in desk/oracle-safe-replay.md
      # as history; there is nothing left to compare forward.

      - name: Commit the record
        run: |
          git config user.name "desk-bot"
          git config user.email "desk-bot@users.noreply.github.com"
          git add trading/desk/oracle-forward.md trading/desk/oracle-state.json
          if git diff --cached --quiet; then
            echo "no change to record"
            exit 0
          fi
          git commit -m "oracle paper record $(date -u +%Y-%m-%dT%H:%MZ)"
          # The intraday `paper` job commits to this same branch, so a plain push can be
          # rejected when it lands first. Rebase onto whatever arrived, then retry: the
          # record is the only file this job owns, so a rebase cannot clobber it.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing onto the remote (attempt $attempt)"
            git pull --rebase --no-edit origin main || exit 1
          done
          echo "could not push the record after 3 attempts" >&2
          exit 1
