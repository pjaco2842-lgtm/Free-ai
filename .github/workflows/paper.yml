name: paper

# The rule only enters 13:00-20:00 UTC, so the job only needs to run then.
# Every run replays every closed bar since the last one it saw, so a missed or
# delayed run cannot skip a trade — it just catches up on the next pass.
on:
  schedule:
    - cron: "*/15 13-20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: paper-desk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Advance the paper book
        run: python3 trading/paper_aggressive.py --commit

      - name: Save the ledger
        run: |
          git config user.name "paper-desk"
          git config user.email "paper-desk@users.noreply.github.com"
          git add trading/desk/paper-state.json trading/desk/paper-forward.md
          if git diff --cached --quiet; then
            echo "no change this pass"
            exit 0
          fi
          git commit -m "paper: $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            sleep 5
          done
