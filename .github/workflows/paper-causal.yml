# The causal paper desk, once per trading day, with no laptop involved.
#
# Why this exists: the plan is "run it a couple of days, then judge it". That only
# works if the record grows without anyone remembering to type a command.
#
# Timing: 12:10 UTC, NOT just after the 22:00 UTC futures close. Yahoo relabels the
# futures daily bar to the new session at 23:00 UTC, so a job running at 23:10 finds a
# bar dated "today" that is ten minutes old and, with --settle-today, books it as a
# finished session. That is exactly what happened on 2026-11-03 (see RESEARCH-LOG
# (xviii)). Running at 12:10 UTC means today's forming bar is unambiguously labelled
# today, the runner's own guard skips it without help, and the completed prior session
# is what gets settled. The record is one session behind intraday; it is never wrong.
#
# Security: one permission (contents: write), the action pinned to a commit SHA, no
# secrets, no user-controlled values interpolated into the shell, and `git add`
# limited to the bar data and the desk directory.

name: paper-causal

on:
  schedule:
    - cron: "10 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-causal
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true

      # Fresh bars first: settling against a stale file is how a paper record turns
      # into a replay without anyone noticing.
      - name: Refresh the bars
        run: |
          set -euo pipefail
          python3 --version
          python3 trading/fetch_bars.py

      # No --settle-today here, deliberately. The guard settles every bar dated before
      # today, which at 12:10 UTC is every session that has actually finished.
      - name: Settle the finished sessions and print the next orders
        run: |
          set -euo pipefail
          python3 trading/paper_causal.py --all --since 2026-09-15 | tee /tmp/desk.txt
          cat /tmp/desk.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Record it
        run: |
          set -euo pipefail
          git config user.name  "paper-desk-bot"
          git config user.email "paper-desk-bot@users.noreply.github.com"
          git add -A trading/data trading/desk
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "paper: settle $(date -u +%F)"
          git push
